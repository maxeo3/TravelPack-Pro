<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TravelPack Pro</title>

    <!-- META TAGS PER INSTALLAZIONE PWA SU SMARTPHONE -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TravelPack">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="theme-color" content="#2a9d8f">

    <style>
        :root {
            --primary: #2a9d8f; --secondary: #264653; --accent: #e9c46a;
            --danger: #e76f51; --bg: #f0f2f5; --white: #ffffff;
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--secondary); -webkit-tap-highlight-color: transparent; }
        .container { max-width: 600px; margin: 0 auto; padding-bottom: 40px; }
        .card { background: var(--white); border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h1 { text-align: center; color: var(--primary); margin: 10px 0; font-size: 1.5rem; }
        label { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; opacity: 0.8; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; box-sizing: border-box; outline: none; }
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { border: none; border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--primary); color: white; width: 100%; }
        .btn-save { background: var(--secondary); color: white; margin-top: 10px; width: 100%; }
        .total-progress { margin: 20px 0; text-align: center; }
        .bar-outer { background: #ddd; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 5px; }
        .bar-inner { background: var(--primary); height: 100%; width: 0%; transition: 0.5s; }
        .cat-card { background: white; border-radius: 10px; margin-bottom: 10px; overflow: hidden; border: 1px solid #eee; }
        .cat-header { background: #f8f9fa; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #eee; }
        .cat-title { font-weight: bold; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .cat-perc { font-size: 0.75rem; background: var(--accent); padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .cat-content { display: block; }
        .cat-content.hidden { display: none; }
        .item-row { display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid #f9f9f9; gap: 10px; }
        .item-row.checked span { text-decoration: line-through; opacity: 0.4; }
        .item-row span { flex-grow: 1; font-size: 0.95rem; }
        .item-row input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--primary); flex-shrink: 0; }
        .btn-del { color: var(--danger); background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 5px; }
        .archive-area { border-top: 2px dashed #ccc; margin-top: 20px; padding-top: 20px; }
        .qty-tag { color: var(--primary); font-weight: bold; margin-right: 5px; font-size: 0.85rem; }
    </style>
    <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="container">
    <h1>🧳 TravelPack Pro</h1>

    <div class="card">
        <label>Nome Viaggio / Meta</label>
        <input type="text" id="meta-name" placeholder="Es: Capodanno, Vacanza Mare...">
        
        <div class="setup-grid">
            <div>
                <label>Stagione</label>
                <select id="season">
                    <option value="inverno">❄️ Inverno</option>
                    <option value="estate">☀️ Estate</option>
                    <option value="primavera">🌸 Primavera</option>
                    <option value="autunno">🍂 Autunno</option>
                </select>
            </div>
            <div>
                <label>Giorni</label>
                <input type="number" id="days-count" value="7" min="1">
            </div>
        </div>
        <button class="btn btn-main" onclick="createNewTrip()">GENERA LISTA</button>
    </div>

    <div class="total-progress" id="progress-area" style="display:none;">
        <span id="total-text" style="font-weight: bold;">Valigia: 0%</span>
        <div class="bar-outer"><div class="bar-inner" id="total-bar"></div></div>
    </div>

    <div id="list-container"></div>

    <div class="card" id="add-item-area" style="display:none;">
        <label>Aggiungi altro</label>
        <div style="display:flex; gap:5px;">
            <input type="text" id="new-item-name" placeholder="Es: Ombrello">
            <select id="new-item-cat" style="width:130px">
                <option value="Abbigliamento">Abbigliamento</option>
                <option value="Bimbi">Bimbi</option>
                <option value="Genitori">Genitori</option>
                <option value="Igiene">Igiene</option>
                <option value="Cane">Cane</option>
                <option value="Tech">Tech</option>
            </select>
            <button class="btn btn-main" onclick="addItem()" style="width:50px">+</button>
        </div>
        <div style="margin-top:10px; display:flex; gap:5px;">
            <button class="btn btn-save" onclick="saveCurrentTripToArchive()">💾 Salva sul mio telefono</button>
            <button class="btn btn-main" onclick="generaLinkCondividibile()">🔗 Condividi Link</button>
        </div>
    </div>

    <div class="card archive-area">
        <label>I tuoi viaggi salvati</label>
        <select id="archive-select"></select>
        <div class="setup-grid">
            <button class="btn btn-save" onclick="loadTripFromArchive()">CARICA</button>
            <button class="btn btn-save" style="background:#888" onclick="deleteFromArchive()">ELIMINA</button>
        </div>
    </div>
</div>

<script>
// I TUOI PRESET AGGIORNATI (Liste esatte che mi hai fornito)
const presets = {
    inverno: {
        "Abbigliamento": ["Calze", "Mutande", "Pigiama", "Calzamaglia", "Maglione", "Magliette", "Pantaloni", "Tuta da sci", "Cappelli", "Passacollo", "Guanti", "Scarponcini"],
        "Bambini": ["Pannolini Balkan", "Salviette", "Body lunghi e corti", "Giochi", "Sacchi passeggino", "Medicine bambini", "Bavaglino", "Aerosol"],
        "Igiene e Cura": ["Shampoo", "Bagnoschiuma", "Pettine spazzola", "Crema viso", "Crema corpo", "Trucchi", "Struccante", "Spazzolino", "Dentifricio", "Collutorio", "Filo interdentale", "Salvaslip", "Assorbente", "Fazzoletti", "Lavanaso", "Medicine", "Termometro"],
        "Accessori e Tech": ["Caricabatterie", "Caricabatterie orologio", "Selfie stick", "Telepass", "Firestick", "Zaino Edo", "Zaino della montagna", "Marsupio", "Coperta"],
        "Cane": ["Cibo Arya", "Guinzaglio", "Ciotole"],
        "Altro": ["Sali", "Bite", "Snack"]
    },
    estate: {
        "Bimbi": ["Pannolini", "Pannolini acqua", "Costumini", "Poncho", "Asciugamani", "Body", "Magliette", "Braghette", "Due cambi lunghi", "Cappelli", "Occhiali sole", "Giochi spiaggia", "Ciabattine", "Sandalini", "Bavaglini", "Salviette", "Creme corpo", "Bagnoschiuma", "Intimo", "Shampoo", "Aloe", "Crema culetto", "Tachipirina", "Termometro", "Fisiologica", "Siringa", "Cerotti", "Citrosil", "Mussole"],
        "Genitori": ["Costumi", "Teli mare", "Mutande", "Calze", "Vestiti corti", "Vestiti lunghi", "Vestiti spiaggia", "Felpa", "Ciabatte", "Cappelli", "Creme solari", "Crema corpo", "Spazzolino", "Dentifricio", "Salone intimo", "Bagnoschiuma", "Shampoo", "Scarpe/sandali", "Tachipirina", "Brufen", "Spazzola", "Pettine", "Burro cacao", "Trucchi", "Struccante", "Forbicine", "Pinzette", "Rasoio", "Fazzoletti", "Borracce", "Byte", "Rumori bianchi", "Lucina", "Antizanzare", "Marsupio per Gabri", "Sapone", "Zaino spiaggia"]
    },
    primavera: { "Generale": ["Giacca leggera", "Scarpe comode", "Ombrello"], "Igiene": ["Spazzolino", "Dentifricio"] },
    autunno: { "Generale": ["Giacca pioggia", "Scarpe pesanti", "Sciarpa"], "Igiene": ["Spazzolino", "Dentifricio"] }
};

const scalableItems = ["Mutande", "Calze", "Body", "Pannolini", "Pigiama", "Cibo", "Fruttini", "Crackers", "Magliette", "Bavaglini", "Cambi", "Vestiti"];

let activeTrip = { name: "", season: "", days: 1, categories: {}, collapsed: {} };

function createNewTrip() {
    const season = document.getElementById('season').value;
    const days = parseInt(document.getElementById('days-count').value);
    const meta = document.getElementById('meta-name').value || "Mio Viaggio";
    let template = presets[season];
    
    activeTrip = { name: meta, season: season, days: days, categories: {}, collapsed: {} };
    for (let cat in template) {
        activeTrip.categories[cat] = template[cat].map(item => ({ name: item, checked: false }));
        activeTrip.collapsed[cat] = false;
    }
    document.getElementById('progress-area').style.display = 'block';
    document.getElementById('add-item-area').style.display = 'block';
    render();
}

function render() {
    const container = document.getElementById('list-container');
    container.innerHTML = '';
    let total = 0, checked = 0;
    for (let cat in activeTrip.categories) {
        const items = activeTrip.categories[cat];
        const isCol = activeTrip.collapsed[cat];
        const catDone = items.filter(i => i.checked).length;
        const catPerc = items.length === 0 ? 0 : Math.round((catDone / items.length) * 100);
        total += items.length; checked += catDone;

        const catDiv = document.createElement('div');
        catDiv.className = 'cat-card';
        catDiv.innerHTML = `
            <div class="cat-header" onclick="toggleCollapse('${cat}')">
                <div class="cat-title"><span>${isCol ? '▶' : '▼'}</span> ${cat}</div>
                <div class="cat-perc">${catPerc}%</div>
            </div>
            <div class="cat-content ${isCol ? 'hidden' : ''}">
                ${items.map((item, idx) => `
                    <div class="item-row ${item.checked ? 'checked' : ''}">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItem('${cat}', ${idx})">
                        <span>${getQty(item.name)} ${item.name}</span>
                        <button class="btn-del" onclick="deleteItem('${cat}', ${idx})">×</button>
                    </div>
                `).join('')}
            </div>`;
        container.appendChild(catDiv);
    }
    const totalPerc = total === 0 ? 0 : Math.round((checked / total) * 100);
    document.getElementById('total-text').innerText = `${activeTrip.name} - ${totalPerc}%`;
    document.getElementById('total-bar').style.width = totalPerc + '%';
    updateArchiveList();
}

function getQty(name) {
    if (scalableItems.some(s => name.toLowerCase().includes(s.toLowerCase()))) return `<span class="qty-tag">x${activeTrip.days}</span>`;
    return "";
}

function toggleItem(cat, idx) { activeTrip.categories[cat][idx].checked = !activeTrip.categories[cat][idx].checked; render(); }
function toggleCollapse(cat) { activeTrip.collapsed[cat] = !activeTrip.collapsed[cat]; render(); }
function deleteItem(cat, idx) { activeTrip.categories[cat].splice(idx, 1); render(); }
function addItem() {
    const name = document.getElementById('new-item-name').value;
    const cat = document.getElementById('new-item-cat').value;
    if (!name) return;
    if (!activeTrip.categories[cat]) activeTrip.categories[cat] = [];
    activeTrip.categories[cat].push({ name: name, checked: false });
    document.getElementById('new-item-name').value = '';
    render();
}

// --- FUNZIONI ARCHIVIO LOCALE ---
function saveCurrentTripToArchive() {
    const archive = JSON.parse(localStorage.getItem('tp_arch') || '{}');
    const saveName = prompt("Salva con nome:", activeTrip.name);
    if (saveName) { archive[saveName] = activeTrip; localStorage.setItem('tp_arch', JSON.stringify(archive)); updateArchiveList(); }
}

function loadTripFromArchive() {
    const name = document.getElementById('archive-select').value;
    const archive = JSON.parse(localStorage.getItem('tp_arch') || '{}');
    if (name && archive[name]) {
        activeTrip = archive[name];
        document.getElementById('meta-name').value = activeTrip.name;
        document.getElementById('days-count').value = activeTrip.days;
        document.getElementById('season').value = activeTrip.season;
        document.getElementById('progress-area').style.display = 'block';
        document.getElementById('add-item-area').style.display = 'block';
        render();
    }
}

function deleteFromArchive() {
    const name = document.getElementById('archive-select').value;
    if (name && confirm("Eliminare permanentemente?")) {
        const archive = JSON.parse(localStorage.getItem('tp_arch') || '{}');
        delete archive[name]; localStorage.setItem('tp_arch', JSON.stringify(archive));
        updateArchiveList();
    }
}

function updateArchiveList() {
    const archive = JSON.parse(localStorage.getItem('tp_arch') || '{}');
    const select = document.getElementById('archive-select');
    select.innerHTML = '<option value="">-- Seleziona --</option>';
    for (let name in archive) {
        const opt = document.createElement('option');
        opt.value = name; opt.innerText = name; select.appendChild(opt);
    }
}

// --- FUNZIONE CONDIVIDI LINK ---
function generaLinkCondividibile() {
    const jsonData = JSON.stringify(activeTrip);
    const base64Data = btoa(jsonData);
    const urlCorrente = new URL(window.location);
    urlCorrente.searchParams.set('tp', base64Data);
    const linkFinale = urlCorrente.toString();
    
    navigator.clipboard.writeText(linkFinale).then(() => {
        alert("Link copiato negli appunti!\nIncolla su WhatsApp\Telegram.\n\n" + linkFinale);
    }).catch(() => {
        alert("Link generato: " + linkFinale);
    });
}

// --- FUNZIONE CARICA DA LINK ---
function caricaDaLink() {
    const urlParams = new URLSearchParams(window.location.search);
    const codiceViaggio = urlParams.get('tp');
    
    if (codiceViaggio) {
        try {
            const jsonStr = atob(codiceViaggio);
            activeTrip = JSON.parse(jsonStr);
            
            document.getElementById('meta-name').value = activeTrip.name;
            document.getElementById('days-count').value = activeTrip.days;
            document.getElementById('season').value = activeTrip.season;
            
            showApp();
            render();
            
        } catch (e) {
            console.error("Errore nel decodificare il link", e);
            alert("Il link non è valido.");
        }
    }
}

function showApp() {
    document.getElementById('progress-area').style.display = 'block';
    document.getElementById('add-item-area').style.display = 'block';
}

// Inizializzazione: Prima controllo il link, poi l'archivio
window.onload = function() {
    caricaDaLink();
    // Se non c'è un link fresco, mostriamo l'elenco archivio per eventuale ricarica
    // Aggiorniamo la lista archivio ma non carichiamo automaticamente un vecchio viaggio 
    // per evitare di sovrascrivere il link appena caricato, 
    // ma lasciamo che l'utente prema il tasto "CARICA" se vuole.
    updateArchiveList(); 
};
</script>
<script>
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    // Impedisce al browser di mostrare il prompt automatico
    e.preventDefault();
    deferredPrompt = e;
    // Qui potresti mostrare un tuo bottone personalizzato "Installa App"
    console.log('App installabile!');
  });

  // Se vuoi forzare l'installazione su un tasto specifico:
  function installApp() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
    }
  }
</script>
</body>
</html>
